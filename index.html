<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Martin Warner – World Wide Workshops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e8f1f8;
      --panel: #ffffff;
      --panel-border: #d0e0ef;
      --accent: #e11d48;
      --accent-soft: #fb7185;
      --text: #1e293b;
      --text-muted: #64748b;
      --upcoming: #16a34a;
      --globe-bg: #c5dcec;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
      position: relative;
    }

    /* Globe area */
    .globe-wrap {
      flex: 1;
      position: relative;
      background: radial-gradient(ellipse at center, #d6eaf8 0%, #b8d4ea 60%, #9fc4e0 100%);
      min-width: 0;
    }

    #globeViz {
      width: 100%;
      height: 100%;
    }

    /* Search */
    .search-box {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 15;
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.95);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 10px 14px;
      width: min(280px, calc(100% - 80px));
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .search-box svg {
      width: 17px;
      height: 17px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13.5px;
      margin-left: 10px;
      width: 100%;
      font-family: inherit;
    }

    .search-box input::placeholder { color: var(--text-muted); }

    /* Toggle sidebar button */
    .sidebar-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 20;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--panel-border);
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .sidebar-toggle:hover { background: #f1f5f9; }

    .sidebar-toggle svg {
      width: 20px;
      height: 20px;
      color: var(--text);
    }

    /* Info popup */
    .info-card {
      position: absolute;
      z-index: 16;
      background: #fff;
      color: #0f172a;
      border-radius: 12px;
      padding: 14px 16px;
      min-width: 200px;
      max-width: 260px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.18);
      display: none;
      animation: fadeIn 0.18s ease;
    }

    .info-card.visible { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .info-card .close {
      position: absolute;
      top: 8px;
      right: 10px;
      background: none;
      border: none;
      font-size: 18px;
      color: #94a3b8;
      cursor: pointer;
      line-height: 1;
    }

    .info-card h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
      padding-right: 18px;
      line-height: 1.3;
    }

    .info-card .date {
      font-size: 12.5px;
      color: #64748b;
    }

    .info-card .status-badge {
      display: inline-block;
      margin-top: 8px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .info-card .status-badge.completed {
      background: #fee2e2;
      color: #b91c1c;
    }

    .info-card .status-badge.upcoming {
      background: #dcfce7;
      color: #15803d;
    }

    /* Location pins */
    .map-pin {
      width: 28px;
      height: 40px;
      cursor: pointer;
      transform: translate(-50%, -100%);
      transition: transform 0.15s ease;
      filter: drop-shadow(0 3px 4px rgba(0,0,0,0.35));
    }

    .map-pin:hover {
      transform: translate(-50%, -100%) scale(1.15);
    }

    .map-pin.active {
      transform: translate(-50%, -100%) scale(1.22);
      filter: drop-shadow(0 4px 8px rgba(225,29,72,0.5));
    }

    .map-pin svg { width: 100%; height: 100%; }

    /* Sidebar – collapsible */
    .sidebar {
      width: 340px;
      background: var(--panel);
      border-left: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.3s ease, width 0.3s ease;
      z-index: 25;
      box-shadow: -4px 0 24px rgba(0,0,0,0.06);
    }

    .sidebar.collapsed {
      transform: translateX(100%);
      width: 0;
      border: none;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 18px 18px 10px;
      border-bottom: 1px solid var(--panel-border);
      flex-shrink: 0;
    }

    .sidebar-header h2 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin-top: 12px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
      background: transparent;
      font-family: inherit;
    }

    .tab.active {
      background: rgba(225, 29, 72, 0.1);
      color: var(--accent);
    }

    .tab:hover:not(.active) {
      background: #f1f5f9;
      color: var(--text);
    }

    .list-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px 20px;
    }

    .list-wrap::-webkit-scrollbar { width: 5px; }
    .list-wrap::-webkit-scrollbar-track { background: transparent; }
    .list-wrap::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

    .workshop-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 2px;
    }

    .workshop-item:hover { background: #f1f5f9; }
    .workshop-item.active { background: rgba(225, 29, 72, 0.08); }

    .workshop-item .pin-icon {
      width: 18px;
      height: 24px;
      flex-shrink: 0;
    }

    .workshop-item .pin-icon svg { width: 100%; height: 100%; }

    .workshop-item .info { flex: 1; min-width: 0; }

    .workshop-item .name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .workshop-item .date {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .workshop-item.online .pin-icon {
      opacity: 0.5;
    }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .hint {
      position: absolute;
      bottom: 14px;
      left: 16px;
      font-size: 11.5px;
      color: #475569;
      background: rgba(255,255,255,0.85);
      padding: 5px 12px;
      border-radius: 8px;
      z-index: 10;
      pointer-events: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    /* Mobile */
    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        top: 0;
        right: 0;
        height: 100%;
        width: min(320px, 88vw);
        max-width: 340px;
      }

      .sidebar.collapsed {
        transform: translateX(100%);
      }

      .search-box {
        width: calc(100% - 70px);
      }

      .hint {
        display: none;
      }
    }

    @media (max-width: 480px) {
      .sidebar {
        width: 100%;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="app">
    <div class="globe-wrap">
      <div class="search-box">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input type="text" id="searchInput" placeholder="Search workshops…" autocomplete="off" />
      </div>

      <button class="sidebar-toggle" id="sidebarToggle" title="Toggle workshop list" aria-label="Toggle workshop list">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <div id="globeViz"></div>

      <div class="info-card" id="infoCard">
        <button class="close" id="closeCard">&times;</button>
        <h3 id="cardTitle"></h3>
        <div class="date" id="cardDate"></div>
        <div class="status-badge" id="cardStatus"></div>
      </div>

      <div class="hint">Drag to rotate · Scroll to zoom · Click a pin</div>
    </div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Workshops</h2>
        <div class="tabs">
          <button class="tab active" data-tab="completed">Completed</button>
          <button class="tab" data-tab="upcoming">Upcoming</button>
        </div>
      </div>
      <div class="list-wrap" id="workshopList"></div>
    </aside>
  </div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl@2.31.0/dist/globe.gl.min.js"></script>

  <script>

    // ============================================================

      { id: 11, name: "Boston, Cape Cod/Bourne",      country: "USA",            lat: 41.739,  lng: -70.607, date: "10–14 March 2025",      status: "completed" },

      { id: 18, name: "Sydney",                       country: "Australia",      lat: -33.868, lng: 151.209, date: "8–10 May 2025",         status: "completed" },

      { id: 25, name: "Online – Zoom",                country: "",               lat: null,    lng: null,    date: "4–5 October 2025",      status: "completed" },

      { id: 28, name: "Iceland",                      country: "Iceland",        lat: 64.147,  lng: -21.942, date: "16–20 February 2026",   status: "completed" },
      { id: 29, name: "Toronto",                      country: "Canada",         lat: 43.653,  lng: -79.383, date: "2–6 March 2026",        status: "completed" },
      { id: 30, name: "St. John’s, Newfoundland",     country: "Canada",         lat: 47.561,  lng: -52.713, date: "9–13 March 2026",       status: "completed" },
      { id: 31, name: "Boston, Cape Cod",             country: "USA",            lat: 41.739,  lng: -70.607, date: "15–21 March 2026",      status: "completed" },
      { id: 32, name: "Boston, Cape Cod",             country: "USA",            lat: 41.739,  lng: -70.607, date: "23–27 March 2026",      status: "completed" },
      { id: 33, name: "Frötuna, Uppsala",             country: "Sweden",         lat: 59.906,  lng: 17.856,  date: "15–17 April 2026",      status: "completed" },
      { id: 34, name: "Online – Zoom",                country: "",               lat: null,    lng: null,    date: "7–8 July 2026",         status: "completed" },
      { id: 35, name: "Online – Zoom",                country: "",               lat: null,    lng: null,    date: "11–12 July 2026",       status: "completed" },
      { id: 36, name: "Smyrna, Atlanta, Georgia",     country: "USA",            lat: 33.884,  lng: -84.514, date: "9–13 September 2026",   status: "completed" },
      { id: 37, name: "Denver, Colorado",             country: "USA",            lat: 39.739,  lng: -104.990,date: "21–25 September 2026",  status: "completed" },
      { id: 38, name: "Sunshine Coast, Queensland",   country: "Australia",      lat: -26.650, lng: 153.067, date: "11–17 October 2026",    status: "upcoming" },
      { id: 39, name: "Whistler, British Columbia",   country: "Canada",         lat: 50.116,  lng: -122.957,date: "28 September–2 October 2026", status: "upcoming" },
      { id: 40, name: "Thessaloniki",                 country: "Greece",         lat: 40.641,  lng: 22.935,  date: "14–18 November 2026",   status: "upcoming" },
      { id: 41, name: "Copenhagen",                   country: "Denmark",        lat: 55.676,  lng: 12.568,  date: "19–23 May 2027",        status: "upcoming" },
      { id: 42, name: "Copenhagen",                   country: "Denmark",        lat: 55.676,  lng: 12.568,  date: "9–15 May 2027",         status: "upcoming" },
    ];

    // ─────────────────────────────────────────────
    // State
    // ─────────────────────────────────────────────
    let currentTab = "completed";
    let activeId = null;
    let sidebarOpen = true;

    // ─────────────────────────────────────────────
    // Pin SVG
    // ─────────────────────────────────────────────
    function pinSVG(color = "#e11d48") {
      return `
        <svg viewBox="0 0 24 36" xmlns="http://www.w3.org/2000/svg">
          <path fill="${color}" d="M12 0C5.4 0 0 5.4 0 12c0 7.2 12 24 12 24s12-16.8 12-24C24 5.4 18.6 0 12 0z"/>
          <circle cx="12" cy="12" r="5" fill="#fff"/>
        </svg>`;
    }

    // ─────────────────────────────────────────────
    // Globe (only workshops with lat/lng)
    // ─────────────────────────────────────────────
    const globeContainer = document.getElementById("globeViz");
    const pinData = WORKSHOPS.filter(w => w.lat !== null && w.lng !== null);

    const globe = Globe()
      .globeImageUrl("//unpkg.com/three-globe/example/img/earth-blue-marble.jpg")
      .bumpImageUrl("//unpkg.com/three-globe/example/img/earth-topology.png")
      .backgroundColor("rgba(0,0,0,0)")
      .showAtmosphere(true)
      .atmosphereColor("#7eb8e0")
      .atmosphereAltitude(0.15)
      .htmlElementsData(pinData)
      .htmlLat("lat")
      .htmlLng("lng")
      .htmlElement(d => {
        const el = document.createElement("div");
        el.className = "map-pin" + (activeId === d.id ? " active" : "");
        el.innerHTML = pinSVG(d.status === "upcoming" ? "#16a34a" : "#e11d48");
        el.style.pointerEvents = "auto";
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          selectWorkshop(d.id);
        });
        return el;
      })
      .htmlElementVisibilityModifier((el, isVisible) => {
        el.style.opacity = isVisible ? 1 : 0;
      })
      (globeContainer);

    globe.pointOfView({ lat: 25, lng: 10, altitude: 2.0 }, 0);

    const resize = () => {
      const { width, height } = globeContainer.getBoundingClientRect();
      globe.width(width).height(height);
    };
    window.addEventListener("resize", resize);
    resize();

    function refreshGlobe() {
      globe.htmlElementsData([...pinData]);
    }

    // ─────────────────────────────────────────────
    // Select / Popup
    // ─────────────────────────────────────────────
    function selectWorkshop(id) {
      const w = WORKSHOPS.find(x => x.id === id);
      if (!w) return;
      activeId = id;

      if (w.lat !== null && w.lng !== null) {
        globe.pointOfView({ lat: w.lat, lng: w.lng, altitude: 1.5 }, 1100);
      }

      showInfoCard(w);
      refreshGlobe();
      renderList();

      // On mobile, optionally close sidebar after selection
      if (window.innerWidth <= 768) {
        // keep open so user can still browse
      }
    }

    function showInfoCard(w) {
      const card = document.getElementById("infoCard");
      const title = w.country ? `${w.name}, ${w.country}` : w.name;
      document.getElementById("cardTitle").textContent = title;
      document.getElementById("cardDate").textContent = w.date;
      const badge = document.getElementById("cardStatus");
      badge.textContent = w.status === "upcoming" ? "Upcoming" : "Completed";
      badge.className = "status-badge " + w.status;
      card.classList.add("visible");
      card.style.left = "45%";
      card.style.top = "28%";
      card.style.transform = "translateX(-10%)";
    }

    document.getElementById("closeCard").addEventListener("click", () => {
      document.getElementById("infoCard").classList.remove("visible");
      activeId = null;
      refreshGlobe();
      renderList();
    });

    // ─────────────────────────────────────────────
    // Sidebar list
    // ─────────────────────────────────────────────
    function renderList() {
      const list = document.getElementById("workshopList");
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      let items = WORKSHOPS.filter(w => w.status === currentTab);

      if (q) {
        items = items.filter(w =>
          w.name.toLowerCase().includes(q) ||
          (w.country && w.country.toLowerCase().includes(q)) ||
          String(w.id).includes(q) ||
          w.date.toLowerCase().includes(q)
        );
      }

      // Sort by date string roughly (newest first for completed, soonest for upcoming)
      // Simple: keep original order which is roughly chronological

      if (items.length === 0) {
        list.innerHTML = '<div class="empty-state">No workshops found</div>';
        return;
      }

      list.innerHTML = items.map(w => {
        const isOnline = w.lat === null;
        const color = w.status === "upcoming" ? "#16a34a" : "#e11d48";
        return `
          <div class="workshop-item ${activeId === w.id ? "active" : ""} ${isOnline ? "online" : ""}" data-id="${w.id}">
            <div class="pin-icon">${isOnline ? '🌐' : pinSVG(color)}</div>
            <div class="info">
              <div class="name">${w.name}${w.country ? ', ' + w.country : ''}</div>
              <div class="date">${w.date}</div>
            </div>
          </div>
        `;
      }).join("");

      list.querySelectorAll(".workshop-item").forEach(el => {
        el.addEventListener("click", () => {
          selectWorkshop(Number(el.dataset.id));
        });
      });
    }

    // Tabs
    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentTab = tab.dataset.tab;
        renderList();
      });
    });

    // Search
    document.getElementById("searchInput").addEventListener("input", renderList);

    // Sidebar toggle
    const sidebar = document.getElementById("sidebar");
    const toggleBtn = document.getElementById("sidebarToggle");

    toggleBtn.addEventListener("click", () => {
      sidebarOpen = !sidebarOpen;
      sidebar.classList.toggle("collapsed", !sidebarOpen);
      // Give globe a moment to resize
      setTimeout(resize, 320);
    });

    // On small screens start with sidebar closed
    if (window.innerWidth <= 768) {
      sidebarOpen = false;
      sidebar.classList.add("collapsed");
    }

    // Init
    renderList();
  </script>
</body>
</html>
