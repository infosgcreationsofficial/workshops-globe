<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Martin Warner – World Wide Workshops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e8f1f8;
      --panel: #ffffff;
      --panel-border: #d0e0ef;
      --accent: #e11d48;
      --text: #1e293b;
      --text-muted: #64748b;
      --upcoming: #16a34a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100%;
      width: 100%;
      position: relative;
    }

    /* Globe area */
    .globe-wrap {
      flex: 1 1 auto;
      position: relative;
      background: radial-gradient(ellipse at center, #d6eaf8 0%, #b8d4ea 60%, #9fc4e0 100%);
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    #globeViz {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Force all globe HTML pins behind UI */
    #globeViz > div,
    #globeViz .map-pin,
    .scene-container,
    .html-overlay {
      z-index: 1 !important;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: #475569;
      font-size: 14px;
      z-index: 5;
      pointer-events: none;
    }

    .loading.hidden { display: none; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #cbd5e1;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Search */
    .search-box {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 100;
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.98);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 8px 12px;
      width: min(300px, calc(100% - 76px));
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      gap: 8px;
    }

    .search-box .search-icon,
    .search-box .clear-btn {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .search-box .clear-btn {
      display: none;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      color: #94a3b8;
      transition: color 0.15s;
    }

    .search-box .clear-btn:hover { color: var(--text); }
    .search-box.has-text .clear-btn { display: flex; align-items: center; justify-content: center; }
    .search-box.has-text .search-icon { display: none; }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
      width: 100%;
      font-family: inherit;
      min-width: 0;
    }

    .search-box input::placeholder { color: var(--text-muted); }

    /* Toggle sidebar button */
    .sidebar-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 100;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--panel-border);
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .sidebar-toggle:hover { background: #f1f5f9; }

    .sidebar-toggle svg {
      width: 22px;
      height: 22px;
      color: var(--text);
    }

    /* Info popup – always on top of pins */
    .info-card {
      position: absolute;
      z-index: 90;
      background: #fff;
      color: #0f172a;
      border-radius: 14px;
      padding: 16px 18px;
      min-width: 210px;
      max-width: 280px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.22);
      display: none;
      pointer-events: auto;
    }

    .info-card.visible { display: block; }

    .info-card .close {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      font-size: 20px;
      color: #94a3b8;
      cursor: pointer;
      line-height: 1;
      padding: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .info-card .close:hover { color: #64748b; }

    .info-card h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;
      padding-right: 22px;
      line-height: 1.3;
    }

    .info-card .date {
      font-size: 13px;
      color: #64748b;
    }

    .info-card .status-badge {
      display: inline-block;
      margin-top: 10px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .info-card .status-badge.completed {
      background: #fee2e2;
      color: #b91c1c;
    }

    .info-card .status-badge.upcoming {
      background: #dcfce7;
      color: #15803d;
    }

    /* Location pins */
    .map-pin {
      width: 28px;
      height: 40px;
      cursor: pointer;
      transform: translate(-50%, -100%);
      transition: transform 0.15s ease;
      filter: drop-shadow(0 3px 4px rgba(0,0,0,0.35));
      z-index: 1 !important;
    }

    .map-pin:hover {
      transform: translate(-50%, -100%) scale(1.15);
    }

    .map-pin.active {
      transform: translate(-50%, -100%) scale(1.22);
      filter: drop-shadow(0 4px 8px rgba(225,29,72,0.5));
    }

    .map-pin svg { width: 100%; height: 100%; }

    /* Sidebar */
    .sidebar {
      width: 340px;
      max-width: 100%;
      background: var(--panel);
      border-left: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.28s ease, margin 0.28s ease;
      z-index: 80;
      box-shadow: -4px 0 24px rgba(0,0,0,0.06);
      height: 100%;
    }

    .sidebar.collapsed {
      transform: translateX(100%);
      margin-right: -340px;
    }

    .sidebar-header {
      padding: 18px 18px 10px;
      border-bottom: 1px solid var(--panel-border);
      flex-shrink: 0;
    }

    .sidebar-header h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin-top: 12px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
      background: transparent;
      font-family: inherit;
    }

    .tab.active {
      background: rgba(225, 29, 72, 0.1);
      color: var(--accent);
    }

    .tab:hover:not(.active) {
      background: #f1f5f9;
      color: var(--text);
    }

    .list-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px 20px;
      -webkit-overflow-scrolling: touch;
    }

    .list-wrap::-webkit-scrollbar { width: 5px; }
    .list-wrap::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

    .workshop-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 2px;
    }

    .workshop-item:hover { background: #f1f5f9; }
    .workshop-item.active { background: rgba(225, 29, 72, 0.08); }

    .workshop-item .pin-icon {
      width: 18px;
      height: 24px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .workshop-item .pin-icon svg { width: 100%; height: 100%; }

    .workshop-item .info { flex: 1; min-width: 0; }

    .workshop-item .name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .workshop-item .date {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .hint {
      position: absolute;
      bottom: 14px;
      left: 16px;
      font-size: 11.5px;
      color: #475569;
      background: rgba(255,255,255,0.9);
      padding: 5px 12px;
      border-radius: 8px;
      z-index: 20;
      pointer-events: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .error-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      padding: 20px 28px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      text-align: center;
      max-width: 320px;
      z-index: 50;
      display: none;
    }

    .error-msg.visible { display: block; }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        right: 0;
        height: 100%;
        width: min(320px, 92vw);
        margin-right: 0 !important;
        z-index: 120;
      }

      .sidebar.collapsed {
        transform: translateX(100%);
      }

      .search-box {
        width: calc(100% - 76px);
        top: 12px;
        left: 12px;
      }

      .sidebar-toggle {
        top: 12px;
        right: 12px;
      }

      /* Popup centered near top of globe on mobile – never under pins */
      .info-card {
        left: 50% !important;
        top: 70px !important;
        transform: translateX(-50%) !important;
        max-width: calc(100% - 32px);
        width: auto;
        min-width: 200px;
      }

      .hint { display: none; }

      /* Dim overlay when sidebar open on mobile */
      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.35);
        z-index: 110;
      }

      .sidebar-overlay.visible {
        display: block;
      }
    }
  </style>
</head>
<body>

    <div class="globe-wrap">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>Loading globe…</div>
      </div>

      <div class="search-box" id="searchBox">

          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input type="text" id="searchInput" placeholder="Search place or workshop…" autocomplete="off" />
        <button class="clear-btn" id="clearBtn" title="Clear search" aria-label="Clear search">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />

      <button class="sidebar-toggle" id="sidebarToggle" title="Toggle workshop list" aria-label="Toggle workshop list">

          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <div id="globeViz"></div>

      <div class="info-card" id="infoCard">
        <button class="close" id="closeCard">&times;</button>
        <h3 id="cardTitle"></h3>
        <div class="date" id="cardDate"></div>
        <div class="status-badge" id="cardStatus"></div>
      </div>

      <div class="hint">Drag to rotate · Scroll to zoom · Click a pin</div>

      <div class="error-msg" id="errorMsg">
        <strong>Could not load the 3D globe</strong><br><br>
        Please host this file online (GitHub Pages / Netlify) or open via a local server.
      </div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Workshops</h2>
        <div class="tabs">
          <button class="tab active" data-tab="completed">Completed</button>
          <button class="tab" data-tab="upcoming">Upcoming</button>
        </div>
      </div>
      <div class="list-wrap" id="workshopList"></div>
    </aside>
  </div>

      { id: 42, name: "Copenhagen",                   country: "Denmark",        lat: 55.676,  lng: 12.568,  date: "9–15 May 2027",         status: "upcoming" },
    ];

    let currentTab = "completed";
    let activeId = null;
    let sidebarOpen = true;
    let globe = null;

    function pinSVG(color) {
      return '<svg viewBox="0 0 24 36" xmlns="http://www.w3.org/2000/svg"><path fill="' + color + '" d="M12 0C5.4 0 0 5.4 0 12c0 7.2 12 24 12 24s12-16.8 12-24C24 5.4 18.6 0 12 0z"/><circle cx="12" cy="12" r="5" fill="#fff"/></svg>';
    }

    // ---------- Search ----------
    const searchInput = document.getElementById("searchInput");
    const searchBox = document.getElementById("searchBox");
    const clearBtn = document.getElementById("clearBtn");

    function updateClearBtn() {
      if (searchInput.value.trim()) {
        searchBox.classList.add("has-text");
      } else {
        searchBox.classList.remove("has-text");
      }
    }

    searchInput.addEventListener("input", function () {
      updateClearBtn();
      renderList();
    });

    searchInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        renderList();
        // Optionally open first result
        const first = document.querySelector(".workshop-item");
        if (first) first.click();
      }
    });

    clearBtn.addEventListener("click", function () {
      searchInput.value = "";
      updateClearBtn();
      renderList();
      searchInput.focus();
    });

    // ---------- List ----------
    function renderList() {
      const list = document.getElementById("workshopList");
      if (!list) return;

      const q = (searchInput.value || "").trim().toLowerCase();
      let items = WORKSHOPS.filter(w => w.status === currentTab);

      if (q) {
        items = items.filter(w => {
          const name = (w.name || "").toLowerCase();
          const country = (w.country || "").toLowerCase();
          const date = (w.date || "").toLowerCase();
          const full = name + " " + country + " " + date;
          return full.includes(q) || String(w.id).includes(q);
        });
      }

      if (items.length === 0) {
        list.innerHTML = '<div class="empty-state">No workshops found</div>';
        return;
      }

      list.innerHTML = items.map(w => {
        const isOnline = w.lat === null;
        const color = w.status === "upcoming" ? "#16a34a" : "#e11d48";
        const pin = isOnline ? "🌐" : pinSVG(color);
        const title = w.country ? w.name + ", " + w.country : w.name;
        return '<div class="workshop-item' + (activeId === w.id ? " active" : "") + '" data-id="' + w.id + '">' +
          '<div class="pin-icon">' + pin + '</div>' +
          '<div class="info"><div class="name">' + title + '</div><div class="date">' + w.date + '</div></div>' +
          '</div>';
      }).join("");

      list.querySelectorAll(".workshop-item").forEach(el => {
        el.addEventListener("click", function () {
          selectWorkshop(Number(el.getAttribute("data-id")));
        });
      });
    }

    function selectWorkshop(id) {
      const w = WORKSHOPS.find(x => x.id === id);
      if (!w) return;
      activeId = id;

      if (globe && w.lat !== null && w.lng !== null) {
        globe.pointOfView({ lat: w.lat, lng: w.lng, altitude: 1.5 }, 1100);
        const pinData = WORKSHOPS.filter(x => x.lat !== null);
        globe.htmlElementsData([...pinData]);
      }

      showInfoCard(w);
      renderList();

      // On mobile, close sidebar after selecting so popup is visible
      if (window.innerWidth <= 768 && sidebarOpen) {
        closeSidebar();
      }
    }

    function showInfoCard(w) {
      const card = document.getElementById("infoCard");
      document.getElementById("cardTitle").textContent = w.country ? w.name + ", " + w.country : w.name;
      document.getElementById("cardDate").textContent = w.date;
      const badge = document.getElementById("cardStatus");
      badge.textContent = w.status === "upcoming" ? "Upcoming" : "Completed";
      badge.className = "status-badge " + w.status;
      card.classList.add("visible");

      // Desktop: place near center-right of globe area
      // Mobile: CSS forces top-center
      if (window.innerWidth > 768) {
        card.style.left = "42%";
        card.style.top = "24%";
        card.style.transform = "none";
      }
    }

    document.getElementById("closeCard").addEventListener("click", function () {
      document.getElementById("infoCard").classList.remove("visible");
      activeId = null;
      renderList();
      if (globe) {
        const pinData = WORKSHOPS.filter(x => x.lat !== null);
        globe.htmlElementsData([...pinData]);
      }
    });

    // Tabs
    document.querySelectorAll(".tab").forEach(function (tab) {
      tab.addEventListener("click", function () {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentTab = tab.getAttribute("data-tab");
        renderList();
      });
    });

    // Sidebar
    const sidebar = document.getElementById("sidebar");
    const toggleBtn = document.getElementById("sidebarToggle");
    const overlay = document.getElementById("sidebarOverlay");

    function openSidebar() {
      sidebarOpen = true;
      sidebar.classList.remove("collapsed");
      if (window.innerWidth <= 768) overlay.classList.add("visible");
      setTimeout(resizeGlobe, 300);
    }

    function closeSidebar() {
      sidebarOpen = false;
      sidebar.classList.add("collapsed");
      overlay.classList.remove("visible");
      setTimeout(resizeGlobe, 300);
    }

    toggleBtn.addEventListener("click", function () {
      if (sidebarOpen) closeSidebar();
      else openSidebar();
    });

    overlay.addEventListener("click", closeSidebar);

    if (window.innerWidth <= 768) {
      sidebarOpen = false;
      sidebar.classList.add("collapsed");
    }

    renderList();

    // ---------- Globe ----------
    function resizeGlobe() {
      if (!globe) return;
      const el = document.getElementById("globeViz");
      const rect = el.getBoundingClientRect();
      if (rect.width > 0 && rect.height > 0) {
        globe.width(rect.width).height(rect.height);
      }
    }

    function initGlobe() {
      if (typeof Globe === "undefined" || typeof THREE === "undefined") {
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("errorMsg").classList.add("visible");
        return;
      }

      const container = document.getElementById("globeViz");
      const pinData = WORKSHOPS.filter(w => w.lat !== null && w.lng !== null);

      try {
        globe = Globe()
          .globeImageUrl("https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg")
          .bumpImageUrl("https://unpkg.com/three-globe/example/img/earth-topology.png")
          .backgroundColor("rgba(0,0,0,0)")
          .showAtmosphere(true)
          .atmosphereColor("#7eb8e0")
          .atmosphereAltitude(0.15)
          .htmlElementsData(pinData)
          .htmlLat("lat")
          .htmlLng("lng")
          .htmlElement(function (d) {
            const el = document.createElement("div");
            el.className = "map-pin" + (activeId === d.id ? " active" : "");
            el.style.zIndex = "1";
            el.innerHTML = pinSVG(d.status === "upcoming" ? "#16a34a" : "#e11d48");
            el.style.pointerEvents = "auto";
            el.addEventListener("click", function (e) {
              e.stopPropagation();
              selectWorkshop(d.id);
            });
            return el;
          })
          (container);

        globe.pointOfView({ lat: 25, lng: 10, altitude: 2.0 }, 0);

        window.addEventListener("resize", resizeGlobe);
        resizeGlobe();
        setTimeout(resizeGlobe, 100);
        setTimeout(resizeGlobe, 400);
        setTimeout(resizeGlobe, 1000);

        document.getElementById("loading").classList.add("hidden");
      } catch (err) {
        console.error(err);
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("errorMsg").classList.add("visible");
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () { setTimeout(initGlobe, 50); });
    } else {
      setTimeout(initGlobe, 50);
    }

    setTimeout(function () { if (!globe) initGlobe(); }, 2000);
  </script>
</body>
</html>
